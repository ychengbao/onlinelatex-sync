[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "onlinelatex-sync"
authors = [
    { name = "Moritz Glöckl", email = "moritzgloeckl@users.noreply.github.com" },
    { name = "ychengbao" },
]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
keywords = ["onlinelatex", "overleaf", "sync", "latex", "tex"]
requires-python = ">=3.11"
dynamic = ["version", "description"]
dependencies = [
    "requests >=2.31,<3",
    "beautifulsoup4 >=4.12,<5",
    "yaspin >=3,<4",
    "click >=8.1,<9",
]

[project.optional-dependencies]
dev = ["pytest >=8", "pytest-cov >=5", "responses >=0.25", "ruff >=0.6"]

[project.urls]
Homepage = "https://github.com/ychengbao/onlinelatex-sync"
Issues = "https://github.com/ychengbao/onlinelatex-sync/issues"

[project.scripts]
onlinelatex = "olsync.olsync:main"

[tool.flit.module]
name = "olsync"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

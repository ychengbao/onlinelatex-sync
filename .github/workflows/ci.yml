name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  unit:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -v
      - run: onlinelatex --version

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/onlinelatex-wheel
          /tmp/onlinelatex-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/onlinelatex-wheel/bin/onlinelatex --version
          /tmp/onlinelatex-wheel/bin/onlinelatex --help
          /tmp/onlinelatex-wheel/bin/onlinelatex login --help
